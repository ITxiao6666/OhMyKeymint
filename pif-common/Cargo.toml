[package]
name = "pif-common"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "../boringssl/build.rs"

[features]
soter-crypto = ["dep:openssl"]

[dependencies]
libc = { version = "0.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
openssl = { version = "0.10.81", features = ["unstable_boringssl", "bindgen"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
