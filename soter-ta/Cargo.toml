[package]
name = "soter-ta"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "../boringssl/build.rs"

[dependencies]
libc = "0.2.190"
log = "0.4.34"
openssl = { version = "0.10.81", features = ["unstable_boringssl", "bindgen"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
